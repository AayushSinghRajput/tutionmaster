services:
  mongo:
    image: mongo:7
    container_name: tutionmaster-mongo
    restart: unless-stopped
    ports:
      - "127.0.0.1:27017:27017"
    volumes:
      - mongo_data:/data/db

  backend:
    build: ./backend
    container_name: tutionmaster-backend
    restart: unless-stopped
    # Overrides the Dockerfile's production CMD (npm start) with the
    # nodemon dev script for live-reload against the bind mount below.
    command: npm run dev
    env_file:
      - ./backend/.env
    environment:
      - MONGODB_URI=mongodb://mongo:27017/tutionmaster
      - CLIENT_URL=http://localhost:3000
      - DOCKER=true
    ports:
      - "8000:8000"
    # The anonymous volume below caches node_modules built for Linux inside
    # the container, so the bind mount above (for live-reload) doesn't get
    # clobbered by a Windows/macOS-built node_modules from the host. Trade-off:
    # it also survives image rebuilds, so after adding/changing a dependency
    # in package.json, `docker compose up --build` alone isn't enough — the
    # old volume still shadows the new node_modules. Run:
    #   docker compose up -d --build --renew-anon-volumes backend
    # (or `docker volume rm` the volume shown by `docker inspect`) to refresh it.
    volumes:
      - ./backend:/app
      - /app/node_modules
    depends_on:
      - mongo

  frontend:
    build: ./frontend
    container_name: tutionmaster-frontend
    restart: unless-stopped
    env_file:
      - ./frontend/.env
    environment:
      - REACT_APP_API_URL=http://localhost:8000/api/v1
    ports:
      - "3000:3000"
    # Same anonymous-volume caveat as the backend service above — after
    # changing frontend/package.json, run:
    #   docker compose up -d --build --renew-anon-volumes frontend
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend

volumes:
  mongo_data:
