[build]
  base = "frontend"
  command = "npm run build"
  publish = "frontend/build"

[build.environment]
  NODE_VERSION = "20"

# React Router uses client-side routing (BrowserRouter), so every
# unknown path must fall back to index.html.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
